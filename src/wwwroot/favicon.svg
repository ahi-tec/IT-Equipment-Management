<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="100%" style="stop-color:#3949ab"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Monitor -->
  <rect x="7" y="7" width="18" height="13" rx="1.5" fill="none" stroke="#fff" stroke-width="1.5"/>
  <rect x="9" y="9" width="14" height="9" rx="0.5" fill="#64b5f6" opacity="0.3"/>
  <!-- Screen content - gear -->
  <circle cx="16" cy="13" r="3" fill="none" stroke="#64b5f6" stroke-width="1"/>
  <circle cx="16" cy="13" r="1" fill="#64b5f6"/>
  <!-- Stand -->
  <line x1="16" y1="20" x2="16" y2="23" stroke="#fff" stroke-width="1.5"/>
  <line x1="12" y1="23" x2="20" y2="23" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Checkmark -->
  <circle cx="23" cy="23" r="5" fill="#4caf50"/>
  <polyline points="20.5,23 22,24.5 25.5,21" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
